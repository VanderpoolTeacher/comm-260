<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">What it buys and what it costs</title>
  <desc id="desc">A two-column comparison with three rows: Subject isolated leads to The room; Attention directed leads to The situation; Space to absorb leads to Pace.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L10 6 L1 11" fill="none" stroke="#171717" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#FFFFFF"/>

  <g font-family="Inter, Helvetica Neue, Arial, sans-serif">
    <text x="540" y="260" text-anchor="middle" font-size="52" font-weight="650" fill="#168C78">What it buys</text>
    <text x="1380" y="260" text-anchor="middle" font-size="52" font-weight="650" fill="#76546F">What it costs</text>

    <g font-size="43" font-weight="500">
      <text x="540" y="440" text-anchor="middle" dominant-baseline="middle" fill="#168C78">Subject isolated</text>
      <text x="1380" y="440" text-anchor="middle" dominant-baseline="middle" fill="#76546F">The room</text>
      <path d="M790 440 H1120" fill="none" stroke="#171717" stroke-width="2.5" marker-end="url(#arrow)"/>

      <text x="540" y="620" text-anchor="middle" dominant-baseline="middle" fill="#168C78">Attention directed</text>
      <text x="1380" y="620" text-anchor="middle" dominant-baseline="middle" fill="#76546F">The situation</text>
      <path d="M790 620 H1120" fill="none" stroke="#171717" stroke-width="2.5" marker-end="url(#arrow)"/>

      <text x="540" y="800" text-anchor="middle" dominant-baseline="middle" fill="#168C78">Space to absorb</text>
      <text x="1380" y="800" text-anchor="middle" dominant-baseline="middle" fill="#76546F">Pace</text>
      <path d="M790 800 H1120" fill="none" stroke="#171717" stroke-width="2.5" marker-end="url(#arrow)"/>
    </g>
  </g>
</svg>
