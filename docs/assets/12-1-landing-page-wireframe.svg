<svg xmlns="http://www.w3.org/2000/svg" fill="#1A1D1F" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">Landing page wireframe</title>
<desc id="d">A greyboxed page wireframe. A header band with a logo box and three nav items, a hero with a placeholder image and two lines of placeholder text, a three-across row of media boxes labelled photography, audio and video, a block of body text, and a short footer. No styling and no real copy.</desc>
<style>text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:22px;opacity:0.55}</style>
<rect width="1600" height="900" fill="#E9E6DE"/>

<!-- page edge -->
<rect x="140" y="55" width="1320" height="790" fill="none" stroke="#1A1D1F" stroke-width="2.5" opacity="0.5"/>

<!-- section dividers -->
<g stroke="#1A1D1F" stroke-width="2" opacity="0.35">
<path d="M140 145H1460M140 460H1460M140 670H1460M140 800H1460"/>
</g>

<!-- header : logo left, three nav items right -->
<rect x="180" y="78" width="120" height="44" fill="#1A1D1F" fill-opacity="0.09" stroke="#1A1D1F" stroke-width="2" stroke-opacity="0.45"/>
<g fill="#1A1D1F" opacity="0.22">
<rect x="1140" y="93" width="80" height="14"/>
<rect x="1240" y="93" width="80" height="14"/>
<rect x="1340" y="93" width="80" height="14"/>
</g>

<!-- hero : placeholder image, two lines of placeholder text -->
<rect x="180" y="175" width="1240" height="180" fill="#1A1D1F" fill-opacity="0.09" stroke="#1A1D1F" stroke-width="2" stroke-opacity="0.45"/>
<g stroke="#1A1D1F" stroke-width="2" opacity="0.35">
<path d="M180 175L1420 355M1420 175L180 355"/>
</g>
<g fill="#1A1D1F" opacity="0.22">
<rect x="180" y="380" width="800" height="14"/>
<rect x="180" y="406" width="560" height="14"/>
</g>

<!-- three media placeholders -->
<g fill="#1A1D1F" fill-opacity="0.09" stroke="#1A1D1F" stroke-width="2" stroke-opacity="0.45">
<rect x="180" y="490" width="386" height="120"/>
<rect x="607" y="490" width="386" height="120"/>
<rect x="1034" y="490" width="386" height="120"/>
</g>
<g stroke="#1A1D1F" stroke-width="2" opacity="0.35">
<path d="M180 490L566 610M566 490L180 610"/>
<path d="M607 490L993 610M993 490L607 610"/>
<path d="M1034 490L1420 610M1420 490L1034 610"/>
</g>
<text x="373" y="644" text-anchor="middle">photography</text>
<text x="800" y="644" text-anchor="middle">audio</text>
<text x="1227" y="644" text-anchor="middle">video</text>

<!-- body text block -->
<g fill="#1A1D1F" opacity="0.22">
<rect x="180" y="696" width="1240" height="12"/>
<rect x="180" y="722" width="1240" height="12"/>
<rect x="180" y="748" width="1180" height="12"/>
<rect x="180" y="774" width="820" height="12"/>
</g>

<!-- footer -->
<rect x="140" y="800" width="1320" height="45" fill="#1A1D1F" opacity="0.09"/>
<rect x="180" y="817" width="300" height="10" fill="#1A1D1F" opacity="0.22"/>
</svg>
